name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  sync-agent-docs:
    name: Sync Agent Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test distribution notification boundaries
        run: python3 scripts/test-notify-stack.py
      - name: Test documentation validation
        run: python3 scripts/test-validate-docs.py
      - name: Validate catalogs and local links
        run: python3 scripts/validate-docs.py
      - name: Test reference bundling
        run: python3 scripts/test-bundle-references.py
      - name: Check generated workflow references
        run: python3 scripts/bundle-references.py --check
      - name: Check pull request whitespace
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git diff --check "$BASE_SHA...HEAD"

  validate-frontmatter:
    name: Validate Skill Frontmatter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test validator collection contract and failure paths
        run: bash scripts/test-validate-frontmatter.sh
      - name: Test pre-commit trigger and staged-content guard
        run: bash scripts/test-pre-commit.sh
      - name: Run validator
        run: bash scripts/validate-frontmatter.sh

  changelog:
    name: Changelog Required
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check CHANGELOG.md updated
        run: |
          if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -q '^CHANGELOG.md$'; then
            echo "CHANGELOG.md updated"
          else
            echo "::error::CHANGELOG.md must be updated in every PR. Run scripts/changelog-add.sh \"<entry>\" then commit."
            exit 1
          fi

      - name: Check entry under [Unreleased]
        # Release PRs intentionally promote [Unreleased] to a dated version,
        # leaving [Unreleased] empty. Skip this check for them.
        if: ${{ !startsWith(github.head_ref, 'release/') }}
        run: |
          if ! awk '/^## \[Unreleased\]/{flag=1; next} /^## \[/{flag=0} flag' CHANGELOG.md | grep -qE '^- '; then
            echo "::error::CHANGELOG.md has no entries under [Unreleased]. Add at least one bullet."
            exit 1
          fi
