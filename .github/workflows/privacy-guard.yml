name: Privacy Guard

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: privacy-guard-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  privacy-guard:
    name: Privacy Guard
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" "$base/$archive"
          curl -sSfL -o "$RUNNER_TEMP/checksums.txt" "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          (cd "$RUNNER_TEMP" && grep " ${archive}\$" checksums.txt | sha256sum -c -)
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Scan history for secrets
        run: gitleaks detect --source . --log-opts=--all --redact --no-banner --exit-code 1
      - name: Test denylist guard
        run: bash scripts/test-privacy-denylist.sh
      - name: Check denylist
        env:
          PRIVACY_DENYLIST_EXTRA: ${{ secrets.PRIVACY_DENYLIST_EXTRA }}
        run: bash scripts/privacy-denylist.sh
